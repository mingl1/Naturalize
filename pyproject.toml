[tool.ruff]
# Target Python version
target-version = "py311"

# Exclude virtual environments
exclude = [
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# Rule configurations
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # Line length too long (let formatter handle or ignore)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "native"
